name: docker

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    hadolint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: Dockerfile

    image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4

            - name: Build the image (nothing is pushed)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: phorge-console:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Runs as a non-root user
              run: test "$(docker inspect -f '{{.Config.User}}' phorge-console:ci)" = "65532:65532"

            - name: Starts with no configuration, answers and stops cleanly
              run: |
                  docker run -d --name console --read-only --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 phorge-console:ci
                  for _ in $(seq 1 20); do
                    curl -fsS http://127.0.0.1:3000/healthz && break
                    sleep 1
                  done
                  curl -fsS http://127.0.0.1:3000/healthz
                  curl -fsS http://127.0.0.1:3000/ | grep -qi '<html'
                  # Without the sign-in settings the console answers 503 and the showcase site is not affected.
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/account)" = "503"
                  curl -sI http://127.0.0.1:3000/account | grep -qi '^x-robots-tag: noindex'
                  docker stop console
                  test "$(docker inspect -f '{{.State.ExitCode}}' console)" -eq 0

            - name: Logs of the container
              if: failure()
              run: docker logs console || true

            - name: Cross-build for arm64 and amd64 (the svc nodes are arm64)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha

    publish:
        if: github.event_name == 'push'
        needs:
            - hadolint
            - image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=sha
                      type=raw,value=latest

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
